services:
  console:
    profiles: [console]
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      EVIDENCE_MODE: mock
      LLM_PROVIDER: none
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  pg:
    profiles: [lake]
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: tider, POSTGRES_PASSWORD: tider, POSTGRES_DB: tider}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./src/tider/lake/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
