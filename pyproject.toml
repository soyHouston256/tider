[project]
name = "tider"
version = "0.4.0"
description = "Tider v4: agente RCA con context lake, juez y decisor determinista"
# Probado con 3.12. En 3.15 la instalación falla hoy: uuid-utils (dependencia de langgraph) aún no tiene wheels.
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2", "pydantic>=2.7,<3", "fastapi>=0.110", "uvicorn", "httpx", "pyyaml",
]
[project.optional-dependencies]
llm = ["anthropic"]
pg = ["psycopg[binary]>=3.1"]
dev = ["pytest"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
